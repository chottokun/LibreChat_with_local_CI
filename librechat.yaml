version: "1.3.3"

cache: true

interface:
  runCode: true

fileConfig:
  enabled: true
  uploadDir: ./uploads

endpoints:
  custom:
    - name: "Open AI Compatible"
      apiKey: "${EXTERNAL_API_KEY}"
      baseURL: "${EXTERNAL_API_URL}"
      models:
        default: ["${EXTERNAL_LLM_MODEL}"]
        fetch: true
      titleConvo: true
      summarize: true
      modelDisplayLabel: "Open AI Compatible"

    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "${OLLAMA_BASE_URL}/v1"
      models:
        default: ["qwen3.5:4b"]
        fetch: true
      titleConvo: true
      summarize: true
      modelDisplayLabel: "Ollama"
