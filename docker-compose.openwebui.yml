services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - 'WEBUI_SECRET_KEY='
    volumes:
      - open-webui:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui: {}
