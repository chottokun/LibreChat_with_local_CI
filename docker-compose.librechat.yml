# version: '3.8' (obsolete)

services:
  api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: librechat-rag-api
    restart: always
    environment:
      - DB_PROXY=false
    networks:
      - librechat-network

  mongodb:
    image: mongo:latest
    container_name: librechat-mongodb
    restart: always
    volumes:
      - mongodb-data:/data/db
    networks:
      - librechat-network

  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: librechat-meilisearch
    restart: always
    environment:
      - MEILI_HOST=${MEILI_HOST:-http://0.0.0.0:7700}
      - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-your_master_key}
    volumes:
      - meili-data:/meili_data
    networks:
      - librechat-network

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: always
    ports:
      - "3000:3080"
    depends_on:
      - mongodb
      - meilisearch
      - code-interpreter-api
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - MEILI_HOST=${MEILI_HOST:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-your_master_key}
      - CONFIG_PATH=${CONFIG_PATH:-/app/librechat.yaml}
      - LIBRECHAT_CODE_BASEURL=${LIBRECHAT_CODE_BASEURL:-http://librechat_code_interpreter_api:8000}
      - LIBRECHAT_CODE_API_KEY=${LIBRECHAT_CODE_API_KEY}
      - CODE_API_KEY=${LIBRECHAT_CODE_API_KEY}
      - SANDPACK_BUNDLER_URL=${SANDPACK_BUNDLER_URL:-http://localhost:8080}
      - CONFIG_BYPASS_VALIDATION=${CONFIG_BYPASS_VALIDATION:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ENDPOINTS=${ENDPOINTS}
      - JWT_SECRET=${JWT_SECRET:-32_char_secret_key_used_for_testing_123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-32_char_refresh_key_used_for_testing_456}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy-key-for-ui-testing}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-qwen2.5-coder:3b}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL}
      - GOOGLE_KEY=${GEMINI_API_KEY}
      - GOOGLE_MODELS=gemini-flash-latest,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.1-pro-preview
      - CREDS_KEY=${CREDS_KEY:-f34be427ebaeded2940f7d30100edb51}
      - CREDS_IV=${CREDS_IV:-12345678901234567890123456789012}
      - STORAGE_TYPE=local
      - FILES_DIR=/app/api/data/files
      - IMAGES_DIR=/app/api/data/images
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - librechat-network

  # Override existing services to use the same network
  docker-proxy:
    networks:
      - rce-internal

  code-interpreter-api:
    networks:
      - librechat-network
      - rce-internal

  # ---------------------------------------------------------------------------
  # Ollama Service (Optional - Uncomment to use local models)
  # ---------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: always
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - librechat-network

  # ---------------------------------------------------------------------------
  # Sandpack Bundler Service (For offline/local Artifacts rendering)
  # ---------------------------------------------------------------------------
  sandpack-bundler:
    image: ghcr.io/librechat-ai/codesandbox-client/bundler:latest
    container_name: sandpack-bundler
    restart: always
    ports:
      - "8080:80"
    profiles:
      - ssl-mode  # ★「ssl-mode」プロファイル指定時のみコンテナを起動する
    networks:
      - librechat-network

  # ---------------------------------------------------------------------------
  # Caddy Reverse Proxy Service (For SSL/TLS support in Phase 2 & 3)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "443:443"
      - "8443:8443"
    environment:
      - CUSTOM_CERT_PATH=${CUSTOM_CERT_PATH:-internal}
      - CUSTOM_KEY_PATH=${CUSTOM_KEY_PATH:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles:
      - ssl-mode  # ★「ssl-mode」プロファイル指定時のみコンテナを起動する
    networks:
      - librechat-network
    depends_on:
      - librechat
      - sandpack-bundler

networks:
  librechat-network:
    driver: bridge
  rce-internal:
    internal: true

volumes:
  mongodb-data:
  meili-data:
  ollama-data:
  caddy-data:
  caddy-config:
